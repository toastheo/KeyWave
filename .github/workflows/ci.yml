name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows MSYS2 UCRT64
            os: windows-latest
          - name: Linux
            os: ubuntu-latest
          - name: macOS
            os: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up MSYS2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-fluidsynth

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libgl1-mesa-dev libgl1-mesa-dri libwayland-dev libxkbcommon-dev libgtk-3-dev xorg-dev libfluidsynth-dev xvfb xauth mesa-utils

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install ninja pkg-config fluid-synth

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: cmake -S . -B build -G Ninja -D CMAKE_BUILD_TYPE=Release -D KEYWAVE_ENABLE_AUDIO=ON

      - name: Configure CMake (Linux, including GPU tests)
        if: runner.os == 'Linux'
        run: cmake -S . -B build -G Ninja -D CMAKE_BUILD_TYPE=Release -D KEYWAVE_ENABLE_AUDIO=ON -D KEYWAVE_ENABLE_GPU_TESTS=ON

      - name: Configure CMake (macOS)
        if: runner.os == 'macOS'
        run: cmake -S . -B build -G Ninja -D CMAKE_BUILD_TYPE=Release -D KEYWAVE_ENABLE_AUDIO=ON

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: cmake --build build --parallel

      - name: Build
        if: runner.os != 'Windows'
        run: cmake --build build --config Release --parallel

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: ctest --test-dir build --output-on-failure

      - name: Run tests (Linux, software OpenGL)
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" glxinfo -B
          xvfb-run -a -s "-screen 0 1280x720x24" ctest --test-dir build --build-config Release --output-on-failure

      - name: Run tests (macOS)
        if: runner.os == 'macOS'
        run: ctest --test-dir build --build-config Release --output-on-failure
